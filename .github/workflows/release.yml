# Ao enviar uma tag "v*" (ex.: v0.1.1), compila o instalador, assina a
# atualização e publica a Release com o latest.json usado pelo auto updater.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - run: npm run fetch-cloudflared

      # texto da Release: a seção desta versão no CHANGELOG.md + como instalar
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="[$version]" '
            /^## \[/ { if (found) exit; if (index($0, v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)
          {
            echo "body<<END_OF_NOTES"
            echo "$notes"
            echo
            echo "---"
            echo "Baixe o **AbreTela_${version}_x64-setup.exe** abaixo e instale."
            echo "Quem já tem o AbreTela recebe esta versão automaticamente ao abrir o app."
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AbreTela ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
