# Ao enviar uma tag "v*" (ex.: v0.1.1), compila o instalador, assina a
# atualização e publica a Release com o latest.json usado pelo auto updater.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - run: npm run fetch-cloudflared

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AbreTela ${{ github.ref_name }}
          releaseBody: |
            Baixe o **AbreTela_x.y.z_x64-setup.exe** abaixo e instale.
            Quem já tem o AbreTela recebe esta versão automaticamente ao abrir o app.
          releaseDraft: false
          prerelease: false
