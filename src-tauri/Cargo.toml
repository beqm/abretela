[package]
name = "abretela"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
windows-capture = "2.0.1"
wasapi = "0.26.0"
fast_image_resize = "6.1.0"
jpeg-encoder = "0.7.1"
base64 = "0.23.1"
rayon = "1.12.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Dwm"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
