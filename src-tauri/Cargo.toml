[package]
name = "abretela"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
windows-capture = "2.0.1"
# mesma versão que o windows-capture usa, para trocar as interfaces D3D11
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }
wasapi = "0.26.0"
fast_image_resize = "6.1.0"
jpeg-encoder = "0.7.1"
base64 = "0.23.1"
rayon = "1.12.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
# cliente WebSocket para o teste de integração do servidor da sala
tokio-tungstenite = "0.29"
